name: Build and Publish Docker Image

# 触发方式：
#   1) 推送 main 分支     → 自动发布，版本号按提交数递增（三段式，每段一位数，满 10 进 1）+
#                          更新 latest；
#   2) 推送 v* 标签（如 v1.3.0） → 取标签的纯版本号发布（1.3.0）+ 更新 latest；
#   3) Actions 页面手动触发，可指定版本号（留空则按提交数自动生成）。
#
# 使用前需在仓库 Settings → Secrets and variables → Actions 中配置：
#   DOCKERHUB_USERNAME : Docker Hub 用户名
#   DOCKERHUB_TOKEN    : Docker Hub Access Token（非登录密码）

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "镜像版本标签（留空则按提交数自动生成，如 1.2.0）"
        required: false
        default: ""

env:
  IMAGE_NAME: portbridge

# 同一分支/标签的构建排队执行：新推送会取消仍在进行的旧构建
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 需要完整提交历史，用于生成递增的版本号
          fetch-depth: 0

      - name: Resolve version
        id: ver
        run: |
          # 版本号规则：三段式十进制计数器，每段一位数（0-9），满 10 向左进 1
          #   1.2.9 → 1.3.0，1.9.9 → 2.0.0
          # 基准：提交数首次达到 BASE_COUNT 的那次构建 = 起始版本 1.2.0，之后每次提交 +1
          BASE_COUNT=18
          BASE_VERSION=120   # 1.2.0 压成三位数：major*100 + minor*10 + patch

          if [ "${{ github.ref_type }}" = "tag" ]; then
            # 手动打的标签，只取纯版本号（去掉 v 前缀），如 v1.3.0 → 1.3.0
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ github.event.inputs.version }}" ]; then
            # 手动触发并指定了版本号
            echo "value=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            COUNT=$(git rev-list --count HEAD)
            N=$((BASE_VERSION + COUNT - BASE_COUNT))
            PATCH=$((N % 10))
            MINOR=$((N / 10 % 10))
            MAJOR=$((N / 100))
            echo "value=${MAJOR}.${MINOR}.${PATCH}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          # 标签只用纯版本号 + latest（不再生成 v 前缀或 1.0 这类缩写标签）
          tags: |
            type=raw,value=${{ steps.ver.outputs.value }}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.ver.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
